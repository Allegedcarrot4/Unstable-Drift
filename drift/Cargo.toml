[package]
name = "drift"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["http2"]
http2 = ["drift-core/http2"]

[dependencies]
bytes = "1"
drift-core = { path = "../drift-core", default-features = false }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
