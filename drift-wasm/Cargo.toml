[package]
name = "drift-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
js-sys = "0.3"
drift = { path = "../drift", default-features = false, features = ["http2"] }
drift-core = { path = "../drift-core", default-features = false, features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Headers",
    "MessagePort",
    "Response",
    "ResponseInit",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
