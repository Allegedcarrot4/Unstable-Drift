[workspace]
resolver = "2"
members = [
    "drift-core",
    "drift",
    "drift-cli",
    "drift-wasm",
    "drift-test-support",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Allegedcarrot4/Unstable-Drift"
authors = ["Unstable"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = false
debug = true
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[patch.crates-io]
h2 = { git = "https://github.com/r58Playz/h2-wasm" }
