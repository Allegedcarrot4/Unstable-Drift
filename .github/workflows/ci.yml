name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --workspace --exclude drift-wasm
      - name: Clippy
        run: cargo clippy --workspace --exclude drift-wasm -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude drift-wasm

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Check WASM
        run: cargo check -p drift-wasm --target wasm32-unknown-unknown

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-native, test-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg drift-wasm
      - name: Create npm package.json
        working-directory: drift-wasm/pkg
        run: |
          jq '.name = "@unstable/drift" | .repository.type = "git" | .repository.url = "git+https://github.com/Allegedcarrot4/Unstable-Drift.git" | .publishConfig.access = "public"' package.json > tmp.json && mv tmp.json package.json
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: drift-wasm/pkg
