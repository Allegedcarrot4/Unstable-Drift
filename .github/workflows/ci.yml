name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Build
        run: cargo build --workspace --exclude drift-wasm
      - name: Clippy
        run: cargo clippy --workspace --exclude drift-wasm -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude drift-wasm

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Check WASM
        run: cargo check -p drift-wasm --target wasm32-unknown-unknown

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-native, test-wasm]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg drift-wasm
      - name: Create npm package.json
        working-directory: drift-wasm/pkg
        run: |
          jq '.name = "@allegedcarrot4/drift" | .repository.type = "git" | .repository.url = "git+https://github.com/Allegedcarrot4/Unstable-Drift.git" | .publishConfig.access = "public"' package.json > tmp.json && mv tmp.json package.json
      - name: Publish via OIDC exchange
        working-directory: drift-wasm/pkg
        run: |
          # Get OIDC token from GitHub with npm audience
          OIDC_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm")
          OIDC_TOKEN=$(echo "$OIDC_RESP" | jq -r '.value')
          echo "Got OIDC token: ${OIDC_TOKEN:0:20}..."

          # Exchange for npm session token
          EXCHANGE_RESP=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\"}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/claims/exchange")
          echo "Exchange response: $EXCHANGE_RESP"
          NPM_TOKEN=$(echo "$EXCHANGE_RESP" | jq -r '.token')

          # Configure auth and publish if token received
          if [ "$NPM_TOKEN" != "null" ] && [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm publish --provenance --access public
          else
            echo "Failed to get npm token"
            exit 1
          fi
      - name: Publish to GitHub Packages
        working-directory: drift-wasm/pkg
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm publish --registry=https://npm.pkg.github.com
