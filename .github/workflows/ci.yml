name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Build
        run: cargo build --workspace --exclude drift-wasm
      - name: Clippy
        run: cargo clippy --workspace --exclude drift-wasm -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude drift-wasm

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Check WASM
        run: cargo check -p drift-wasm --target wasm32-unknown-unknown

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-native, test-wasm]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Install LLVM/clang (for ring)
        run: sudo apt-get update && sudo apt-get install -y llvm clang
      - name: Build WASM package
        run: wasm-pack build --target web --out-dir pkg drift-wasm
      - name: Create npm package.json
        working-directory: drift-wasm/pkg
        run: |
          jq '.name = "@allegedcarrot4/drift" | .repository.type = "git" | .repository.url = "git+https://github.com/Allegedcarrot4/Unstable-Drift.git" | .publishConfig.access = "public" | .publishConfig.provenance = true' package.json > tmp.json && mv tmp.json package.json
      - name: Publish to npm
        working-directory: drift-wasm/pkg
        run: |
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" | jq -r '.value')
          echo "//registry.npmjs.org/:_authToken=$OIDC" > .npmrc
          npm publish --access public
      - name: Publish to GitHub Packages
        working-directory: drift-wasm/pkg
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          npm publish --registry=https://npm.pkg.github.com
