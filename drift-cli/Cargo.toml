[package]
name = "drift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "drift"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
drift = { path = "../drift" }
drift-core = { path = "../drift-core" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
